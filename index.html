<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>K Swipe — Full Screen</title>

<style>
  :root{
    --bg1:#0b1220; --bg2:#14244b;
    --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --high:#dc2626; --mod:#f59e0b; --low:#16a34a;
    --shadow:0 18px 55px rgba(0,0,0,.35);
    --radius:28px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body{
    margin:0;
    background: radial-gradient(1200px 800px at 10% 20%, #1a2b5a 0%, transparent 50%),
                radial-gradient(1000px 700px at 90% 30%, #233c7a 0%, transparent 55%),
                linear-gradient(135deg,var(--bg1),var(--bg2));
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:#e5e7eb;
    overflow:hidden;
  }

  /* FULLSCREEN SHELL (iPhone safe areas) */
  .shell{
    position:fixed;
    inset:0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    display:flex;
    justify-content:center;
    align-items:stretch;
  }

  .app{
    width: min(480px, 100%);
    height: 100dvh; /* dynamic viewport on iOS */
    display:flex;
    flex-direction:column;
    padding: 14px 14px 18px;
    gap: 10px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding-top: 6px;
  }

  .brand{
    display:flex; gap:10px; align-items:center;
  }

  .logo{
    width:40px; height:40px; border-radius:14px;
    background: linear-gradient(135deg,#60a5fa,#a78bfa);
    display:grid; place-items:center;
    font-weight:1000;
    box-shadow: 0 10px 30px rgba(96,165,250,.22);
  }

  .title h1{ margin:0; font-size:18px; }
  .title p{ margin:2px 0 0; font-size:12px; color:#94a3b8; }

  .hud{
    text-align:right;
    font-size:12px;
    color:#cbd5f5;
    line-height:1.35;
  }
  .hud b{ color:#fff; }

  .bars{
    display:flex; gap:10px; align-items:center;
    margin-top: 4px;
  }
  .progress{
    flex:1;
    height:10px;
    background: rgba(255,255,255,.12);
    border-radius:999px;
    overflow:hidden;
    border: 1px solid rgba(148,163,184,.16);
  }
  .progress > div{
    height:100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(96,165,250,.95), rgba(167,139,250,.95));
    border-radius:999px;
    transition: width .25s ease;
  }
  .lives{
    display:flex; gap:4px; align-items:center;
    font-size:13px;
    color:#e5e7eb;
    white-space:nowrap;
  }
  .life{
    width:10px; height:10px; border-radius:999px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(148,163,184,.2);
  }
  .life.on{
    background: rgba(34,197,94,.35);
    border-color: rgba(34,197,94,.55);
  }

  .stack{
    position:relative;
    flex: 1;
    min-height: 320px;
  }

  .card{
    position:absolute;
    inset:0;
    background: var(--card);
    color: var(--text);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition: transform .25s ease, opacity .25s ease;
    touch-action:none;
    overflow:hidden;
  }

  .badgeRow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .pill{
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    background:#eef2ff;
    color:#3730a3;
    font-weight:800;
  }
  .pill2{
    background:#f1f5f9;
    color:#0f172a;
  }

  .content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding: 4px 0;
  }

  /* SPRITE TILE */
  .foodImg{
    width: 150px;
    height: 150px;
    border-radius: 26px;
    background-image: url("images/foods-sprite.png");
    background-size: 400% 300%; /* 4 cols x 3 rows */
    background-position: calc(var(--x) * 100%) calc(var(--y) * 100%);
    box-shadow: 0 12px 26px rgba(15,23,42,.15);
    background-color:#f8fafc;
  }

  /* EMOJI TILE fallback */
  .emojiTile{
    width:150px; height:150px;
    border-radius:26px;
    background:#f8fafc;
    box-shadow: 0 12px 26px rgba(15,23,42,.15);
    display:grid; place-items:center;
    font-size:70px;
  }

  .name{
    font-size: 26px;
    font-weight: 1000;
    letter-spacing:-.02em;
    text-align:center;
    margin-top:2px;
  }
  .prompt{
    font-size:14px;
    color:#475569;
    text-align:center;
    max-width: 340px;
  }

  .mealList{
    width:100%;
    margin-top:4px;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-width: 380px;
  }
  .mealItem{
    background:#f1f5f9;
    color:#0f172a;
    border-radius: 14px;
    padding:10px 12px;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .mealItem small{ color:#64748b; }

  /* Swipe overlays */
  .overlay{
    position:absolute;
    top:14px;
    padding:10px 14px;
    border-radius:16px;
    font-weight:1000;
    letter-spacing:.02em;
    opacity:0;
    transform: scale(.98);
    transition: opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .overlay.left{
    left:14px;
    background: rgba(220,38,38,.12);
    border:1px solid rgba(220,38,38,.28);
    color:#fecaca;
  }
  .overlay.up{
    left:50%;
    transform: translateX(-50%) scale(.98);
    background: rgba(245,158,11,.12);
    border:1px solid rgba(245,158,11,.28);
    color:#fde68a;
  }
  .overlay.right{
    right:14px;
    background: rgba(22,163,74,.12);
    border:1px solid rgba(22,163,74,.28);
    color:#bbf7d0;
  }

  .controls{
    display:flex;
    gap:10px;
  }
  button{
    flex:1;
    border:0;
    border-radius:999px;
    padding: 14px 10px;
    font-weight:1000;
    font-size:14px;
    cursor:pointer;
    transition: transform .08s ease;
  }
  button:active{ transform: scale(.98); }

  .btnHigh{ background: rgba(220,38,38,.14); color:#fecaca; border:1px solid rgba(220,38,38,.28) }
  .btnMod { background: rgba(245,158,11,.14); color:#fde68a; border:1px solid rgba(245,158,11,.28) }
  .btnLow { background: rgba(22,163,74,.14); color:#bbf7d0; border:1px solid rgba(22,163,74,.28) }
  .btnHigh span,.btnMod span,.btnLow span{ color:#fff; }

  .toast{
    background: rgba(2,6,23,.55);
    border:1px solid rgba(148,163,184,.18);
    padding: 12px 14px;
    border-radius: 18px;
    font-size:13px;
    line-height:1.35;
    min-height: 54px;
  }
  .toast.good{ border-color: rgba(34,197,94,.35); }
  .toast.bad { border-color: rgba(239,68,68,.35); }
  .toast b{ color:#fff; }

  .footer{
    font-size:11px;
    color:#93a3b8;
    text-align:center;
    padding-bottom: 4px;
  }

  .end{
    background: rgba(255,255,255,.08);
    border:1px solid rgba(148,163,184,.16);
    border-radius: var(--radius);
    padding: 18px;
    text-align:center;
    box-shadow: var(--shadow);
    color:#e5e7eb;
  }
  .end h2{ margin:0 0 6px; font-size:20px; }
  .end p{ margin:6px 0; color:#cbd5f5; font-size:13px; line-height:1.35; }
  .restart{
    margin-top:10px;
    background:#60a5fa;
    color:#0b1220;
  }

  /* Little “pop” animation when correct */
  .pop{
    animation: pop .22s ease;
  }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
</style>
</head>

<body>
<div class="shell">
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">K+</div>
        <div class="title">
          <h1>K Swipe</h1>
          <p>← High · ↑ Moderate · → Low</p>
        </div>
      </div>
      <div class="hud">
        Card <b id="n">1</b>/<b id="total">0</b><br/>
        Score <b id="score">0</b> • Streak <b id="streak">0</b>
      </div>
    </header>

    <div class="bars">
      <div class="progress" aria-label="progress"><div id="prog"></div></div>
      <div class="lives" title="Kidney Shields">
        Shields:
        <span class="life on" id="life1"></span>
        <span class="life on" id="life2"></span>
        <span class="life on" id="life3"></span>
      </div>
    </div>

    <div class="stack" id="stack"></div>

    <div class="controls" id="controls">
      <button class="btnHigh" id="highBtn">⬅ <span>High</span><br/>Limit</button>
      <button class="btnMod" id="modBtn">⬆ <span>Moderate</span><br/>Portion</button>
      <button class="btnLow" id="lowBtn"><span>Low</span> ➡<br/>Safer</button>
    </div>

    <div class="toast" id="toast" style="display:none;"></div>

    <div class="footer">
      Learning tool only. Potassium goals depend on labs, CKD stage, dialysis, meds.
    </div>
  </div>
</div>

<script>
/**
 * GAME DESIGN NOTES (patient-friendly):
 * - Two card types:
 *   1) "food" = single item (3-choice high/mod/low)
 *   2) "meal" = dinner plate (3-choice overall: high/mod/low)
 *
 * - Fun mechanics:
 *   - Streak = combo multiplier milestones
 *   - Shields (lives): wrong answers cost a shield; 0 shields ends the game
 *   - Score: correct +1, wrong -1 (but shields matter more)
 */

// Sprite mapping (your 3x4 grid). These are the 12 tiles in the image.
// Coordinates: x=0..3 (cols), y=0..2 (rows)
const SPRITES = {
  banana:      {x:0, y:0, label:"Banana"},
  avocado:     {x:1, y:0, label:"Avocado"},
  potato:      {x:2, y:0, label:"Potato"},
  tomatoSauce: {x:3, y:0, label:"Tomato Sauce"},
  broccoli:    {x:0, y:1, label:"Broccoli"},
  beans:       {x:1, y:1, label:"Beans"},
  dairy:       {x:2, y:1, label:"Milk/Yogurt"},
  cucumber:    {x:3, y:1, label:"Cucumber"},
  apple:       {x:0, y:2, label:"Apple"},
  blueberries: {x:1, y:2, label:"Blueberries"},
  grapes:      {x:2, y:2, label:"Grapes"},
  cucumber2:   {x:3, y:2, label:"Cucumber (alt)"}
};

// Single-food deck (expanded beyond sprite using emojis)
const FOOD_DECK = [
  // Sprite-backed foods
  { type:"food", key:"banana",      cat:"high", teach:"Bananas are usually high potassium." },
  { type:"food", key:"avocado",     cat:"high", teach:"Avocados are very high potassium." },
  { type:"food", key:"potato",      cat:"high", teach:"Potatoes are high unless leached (boil & drain)." },
  { type:"food", key:"tomatoSauce", cat:"high", teach:"Tomato sauce is concentrated → higher potassium." },
  { type:"food", key:"broccoli",    cat:"mod",  teach:"Broccoli is often moderate; portion matters." },
  { type:"food", key:"beans",       cat:"mod",  teach:"Beans can be moderate to high; portions matter." },
  { type:"food", key:"dairy",       cat:"mod",  teach:"Dairy is often moderate potassium (and phosphorus too)." },
  { type:"food", key:"cucumber",    cat:"low",  teach:"Cucumber is usually low potassium." },
  { type:"food", key:"apple",       cat:"low",  teach:"Apples are generally low potassium." },
  { type:"food", key:"blueberries", cat:"low",  teach:"Blueberries are low potassium and kidney-friendly." },
  { type:"food", key:"grapes",      cat:"low",  teach:"Grapes are low potassium in usual servings." },

  // Emoji-only foods (more options)
  { type:"food", emoji:"🥝", name:"Kiwi", cat:"mod", teach:"Kiwi is often moderate potassium; portion matters." },
  { type:"food", emoji:"🍊", name:"Orange", cat:"high", teach:"Oranges/juice are often high potassium." },
  { type:"food", emoji:"🧃", name:"Orange Juice", cat:"high", teach:"Juice can raise potassium quickly." },
  { type:"food", emoji:"🍉", name:"Watermelon", cat:"mod", teach:"Often moderate; keep portions reasonable." },
  { type:"food", emoji:"🍓", name:"Strawberries", cat:"low", teach:"Many berries are low potassium." },
  { type:"food", emoji:"🍍", name:"Pineapple", cat:"low", teach:"Pineapple tends to be lower potassium." },
  { type:"food", emoji:"🍇", name:"Raisins (dried)", cat:"high", teach:"Dried fruit concentrates potassium." },
  { type:"food", emoji:"🥥", name:"Coconut Water", cat:"high", teach:"Often a potassium bomb — not great for many CKD plans." },
  { type:"food", emoji:"🥬", name:"Spinach (cooked)", cat:"high", teach:"Cooked greens concentrate potassium." },
  { type:"food", emoji:"🍠", name:"Sweet Potato", cat:"high", teach:"Sweet potatoes are often high potassium." },
  { type:"food", emoji:"🍅", name:"Tomato", cat:"mod", teach:"Fresh tomato can be moderate; sauce is higher." },
  { type:"food", emoji:"🥗", name:"Lettuce Salad", cat:"low", teach:"Lettuce is low potassium." },
  { type:"food", emoji:"🍞", name:"Bread", cat:"low", teach:"Most breads are low potassium per slice." },
  { type:"food", emoji:"🍚", name:"White Rice", cat:"low", teach:"Plain white rice is typically low potassium." },
  { type:"food", emoji:"🍟", name:"French Fries", cat:"high", teach:"Potato + portion + salt → usually high potassium." },
  { type:"food", emoji:"🥫", name:"Canned Soup", cat:"mod", teach:"Potassium varies; watch portions and labels." },
];

// Meal components with approximate “category influence”
const MEAL_PARTS = {
  proteinLow: [
    {t:"Chicken (small portion) 🍗", k:"mod"},
    {t:"Eggs 🍳", k:"low"},
    {t:"Fish 🐟", k:"low"},
    {t:"Turkey 🦃", k:"mod"},
  ],
  proteinHigh: [
    {t:"Beans (big portion) 🫘", k:"high"},
    {t:"Lentil bowl 🥣", k:"high"},
  ],
  carbLow: [
    {t:"White rice 🍚", k:"low"},
    {t:"Pasta (no tomato sauce) 🍝", k:"low"},
    {t:"Bread roll 🍞", k:"low"},
  ],
  carbHigh: [
    {t:"Baked potato 🥔", k:"high"},
    {t:"Sweet potato 🍠", k:"high"},
    {t:"Fries 🍟", k:"high"},
  ],
  vegLow: [
    {t:"Cucumber salad 🥒", k:"low"},
    {t:"Lettuce salad 🥗", k:"low"},
    {t:"Cabbage slaw 🥬", k:"low"},
  ],
  vegMod: [
    {t:"Broccoli 🥦", k:"mod"},
    {t:"Carrots 🥕", k:"mod"},
  ],
  sauceHigh: [
    {t:"Tomato sauce 🍅", k:"high"},
    {t:"Marinara 🍅", k:"high"},
  ],
  drinkLow: [
    {t:"Water 💧", k:"low"},
    {t:"Tea ☕️", k:"low"},
  ],
  drinkHigh: [
    {t:"Orange juice 🧃", k:"high"},
    {t:"Coconut water 🥥", k:"high"},
  ],
  dessertLow: [
    {t:"Apple 🍎", k:"low"},
    {t:"Berries 🫐", k:"low"},
    {t:"Grapes 🍇", k:"low"},
  ],
  dessertHigh: [
    {t:"Dried fruit 🍑", k:"high"},
  ]
};

// Build meal cards (dinner plates)
function makeMealCard(){
  // Randomly choose “risk level” so game includes easy + tricky meals
  const roll = Math.random();
  const template = (roll < 0.34) ? "low" : (roll < 0.72) ? "mod" : "high";

  const pick = (arr)=>arr[Math.floor(Math.random()*arr.length)];

  let parts = [];
  if (template === "low"){
    parts = [
      pick(MEAL_PARTS.proteinLow),
      pick(MEAL_PARTS.carbLow),
      pick(MEAL_PARTS.vegLow),
      pick(MEAL_PARTS.drinkLow),
      pick(MEAL_PARTS.dessertLow)
    ];
  } else if (template === "mod"){
    parts = [
      pick(MEAL_PARTS.proteinLow),
      Math.random()<0.5 ? pick(MEAL_PARTS.carbLow) : pick(MEAL_PARTS.carbHigh),
      Math.random()<0.6 ? pick(MEAL_PARTS.vegMod) : pick(MEAL_PARTS.vegLow),
      Math.random()<0.7 ? pick(MEAL_PARTS.drinkLow) : pick(MEAL_PARTS.drinkHigh),
      Math.random()<0.5 ? pick(MEAL_PARTS.dessertLow) : pick(MEAL_PARTS.dessertHigh)
    ];
  } else {
    parts = [
      Math.random()<0.5 ? pick(MEAL_PARTS.proteinHigh) : pick(MEAL_PARTS.proteinLow),
      pick(MEAL_PARTS.carbHigh),
      Math.random()<0.5 ? pick(MEAL_PARTS.sauceHigh) : pick(MEAL_PARTS.vegMod),
      pick(MEAL_PARTS.drinkHigh),
      pick(MEAL_PARTS.dessertHigh)
    ];
  }

  // “Teach” message: short + patient-friendly
  const teach = (template==="low")
    ? "This plate is mostly lower potassium foods. Still: portions matter."
    : (template==="mod")
      ? "This plate has moderate potassium items. Portion + preparation matter."
      : "This plate includes multiple high potassium items (common triggers: potato, sauce, juice, dried fruit).";

  return {
    type:"meal",
    name: (template==="low") ? "Dinner Plate (Safer)" : (template==="mod") ? "Dinner Plate (Tricky)" : "Dinner Plate (High K)",
    emoji: "🍽️",
    cat: template,
    parts,
    teach
  };
}

// Create full deck: mix foods + meals
function buildDeck(){
  const foods = [...FOOD_DECK];
  const meals = Array.from({length: 10}, () => makeMealCard()); // more dinner options
  const combined = [...foods, ...meals];

  // Shuffle
  for (let i=combined.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [combined[i], combined[j]] = [combined[j], combined[i]];
  }
  return combined;
}

// Game state
let deck = buildDeck();
let idx = 0;
let score = 0;
let streak = 0;
let lives = 3;
let busy = false;

// Elements
const stack = document.getElementById("stack");
const toast = document.getElementById("toast");
const nEl = document.getElementById("n");
const totalEl = document.getElementById("total");
const scoreEl = document.getElementById("score");
const streakEl = document.getElementById("streak");
const prog = document.getElementById("prog");

const lifeEls = [
  document.getElementById("life1"),
  document.getElementById("life2"),
  document.getElementById("life3")
];

const highBtn = document.getElementById("highBtn");
const modBtn  = document.getElementById("modBtn");
const lowBtn  = document.getElementById("lowBtn");

totalEl.textContent = deck.length;

function updateHUD(){
  nEl.textContent = Math.min(idx+1, deck.length);
  scoreEl.textContent = score;
  streakEl.textContent = streak;

  const pct = (deck.length === 0) ? 0 : Math.round((idx / deck.length) * 100);
  prog.style.width = pct + "%";

  lifeEls.forEach((el, i) => {
    el.classList.toggle("on", i < lives);
  });
}

function showToast(ok, msg){
  toast.style.display = "block";
  toast.className = "toast " + (ok ? "good" : "bad");

  // small fun flavor, but clinic-safe
  const spice = ok
    ? (streak>=5 ? " Combo streak! 🥷" : "")
    : (lives>0 ? " Shield used 🛡️" : " Oof. 🫠");

  toast.innerHTML = (ok ? "<b>✅ Correct.</b> " : "<b>❌ Not quite.</b> ") + msg + spice;
}

function render(){
  stack.innerHTML = "";
  toast.style.display = "none";

  if (idx >= deck.length || lives <= 0){
    return end();
  }

  updateHUD();

  const c = deck[idx];
  const card = document.createElement("div");
  card.className = "card";

  // Overlays
  const overlays = `
    <div class="overlay left" id="ovLeft">HIGH</div>
    <div class="overlay up" id="ovUp">MODERATE</div>
    <div class="overlay right" id="ovRight">LOW</div>
  `;

  // Top badges
  const top = `
    <div class="badgeRow">
      <div class="pill">Potassium Trainer</div>
      <div class="pill pill2">${c.type === "meal" ? "Dinner Plate" : "Single Food"}</div>
    </div>
  `;

  // Media: sprite if key exists, else emoji tile
  let media = "";
  if (c.type === "food" && c.key && SPRITES[c.key]){
    const s = SPRITES[c.key];
    media = `<div class="foodImg" style="--x:${s.x};--y:${s.y}"></div>`;
  } else {
    const emoji = c.emoji || "🍽️";
    media = `<div class="emojiTile">${emoji}</div>`;
  }

  // Content
  let body = `
    <div class="content">
      ${media}
      <div class="name">${c.type === "food" ? (c.name || SPRITES[c.key]?.label || "Food") : c.name}</div>
      <div class="prompt">
        ${c.type === "meal"
          ? "Overall, is this dinner plate high, moderate, or low potassium?"
          : "Is this food high, moderate, or low potassium?"
        }
      </div>
    </div>
  `;

  // Meal list for dinner plates
  if (c.type === "meal"){
    const items = c.parts.map(p => `<div class="mealItem"><span>${p.t}</span><small>${p.k}</small></div>`).join("");
    body += `<div class="mealList">${items}</div>`;
  }

  // Bottom hint
  const hint = `
    <div style="font-size:12px;color:#64748b;text-align:center;">
      Tip: sauces, juices, dried foods, and potatoes often push potassium higher.
    </div>
  `;

  card.innerHTML = overlays + top + body + hint;
  stack.appendChild(card);

  enableSwipe(card);
}

function answer(choice){
  if (busy) return;
  busy = true;

  const c = deck[idx];
  const ok = (choice === c.cat);

  if (ok){
    score += 1;
    streak += 1;
  } else {
    score -= 1;
    streak = 0;
    lives -= 1;
  }

  updateHUD();
  showToast(ok, c.teach);

  // Animate out
  const card = stack.querySelector(".card");
  if (card){
    if (choice === "high") card.style.transform = "translateX(-160%) rotate(-12deg)";
    if (choice === "low")  card.style.transform = "translateX(160%) rotate(12deg)";
    if (choice === "mod")  card.style.transform = "translateY(-160%) rotate(0deg)";
    card.style.opacity = "0";
  }

  // Milestone fun
  if (ok && (streak === 5 || streak === 10)){
    // subtle pop
    document.querySelector(".app")?.classList.add("pop");
    setTimeout(()=>document.querySelector(".app")?.classList.remove("pop"), 250);
  }

  setTimeout(()=>{
    idx += 1;
    busy = false;
    render();
  }, 520);
}

highBtn.addEventListener("click", ()=>answer("high"));
modBtn.addEventListener("click",  ()=>answer("mod"));
lowBtn.addEventListener("click",  ()=>answer("low"));

function enableSwipe(card){
  let startX=0, startY=0, dx=0, dy=0, dragging=false;

  const ovLeft  = card.querySelector("#ovLeft");
  const ovUp    = card.querySelector("#ovUp");
  const ovRight = card.querySelector("#ovRight");

  const onDown = (e) => {
    if (busy) return;
    dragging = true;
    card.style.transition = "none";
    startX = e.clientX; startY = e.clientY;
    dx = 0; dy = 0;
  };

  const onMove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;

    const rot = Math.max(-15, Math.min(15, dx / 18));
    card.style.transform = `translateX(${dx}px) translateY(${dy}px) rotate(${rot}deg)`;

    const ax = Math.abs(dx), ay = Math.abs(dy);
    ovLeft.style.opacity = 0; ovUp.style.opacity = 0; ovRight.style.opacity = 0;

    if (ax > ay){
      const a = Math.min(1, ax / 120);
      if (dx < 0){ ovLeft.style.opacity = a; ovLeft.style.transform = `scale(${0.98 + a*0.04})`; }
      else { ovRight.style.opacity = a; ovRight.style.transform = `scale(${0.98 + a*0.04})`; }
    } else {
      if (dy < 0){
        const a = Math.min(1, ay / 120);
        ovUp.style.opacity = a;
        ovUp.style.transform = `translateX(-50%) scale(${0.98 + a*0.04})`;
      }
    }
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = "transform .25s ease, opacity .25s ease";

    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > ay && dx <= -110) answer("high");
    else if (ax > ay && dx >= 110) answer("low");
    else if (ay >= ax && dy <= -110) answer("mod");
    else {
      card.style.transform = "translateX(0) translateY(0) rotate(0deg)";
      ovLeft.style.opacity = 0; ovUp.style.opacity = 0; ovRight.style.opacity = 0;
    }
  };

  card.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

function end(){
  document.getElementById("controls").style.display = "none";
  toast.style.display = "block";

  const result = (lives<=0)
    ? "You ran out of Kidney Shields 🛡️"
    : "You finished the deck ✅";

  const coaching = `
    High potassium often comes from: potatoes, tomato sauce, dried fruit, orange juice/coconut water, big portions of beans/greens.
    “Moderate” is where portion + cooking method matters.
  `;

  stack.innerHTML = `
    <div class="end">
      <h2>Game Over</h2>
      <p>${result}</p>
      <p><b>Score:</b> ${score} • <b>Best streak:</b> ${streak}</p>
      <p>${coaching}</p>
      <button class="restart" onclick="restart()">Play again</button>
    </div>
  `;
}

function restart(){
  deck = buildDeck();
  idx = 0; score = 0; streak = 0; lives = 3; busy = false;
  document.getElementById("controls").style.display = "flex";
  totalEl.textContent = deck.length;
  render();
}

// Prevent iOS “double tap to zoom” feel
document.addEventListener("gesturestart", (e) => e.preventDefault());

render();
</script>
