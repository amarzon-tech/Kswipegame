<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>K Swipe</title>

<style>
:root{
  --bg:#0b1220;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --high:#dc2626;
  --mod:#f59e0b;
  --low:#16a34a;
  --radius:26px;
  --shadow:0 18px 45px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0b1220,#13203f);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:#e5e7eb;
  padding:16px;
}

.app{width:min(440px,100%)}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

header h1{
  margin:0;
  font-size:18px;
}

header p{
  margin:2px 0 0;
  font-size:12px;
  color:#94a3b8;
}

.stats{
  font-size:12px;
  color:#cbd5f5;
  text-align:right;
}

.stack{
  position:relative;
  height:380px;
}

.card{
  position:absolute;
  inset:0;
  background:var(--card);
  color:var(--text);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:transform .25s ease, opacity .25s ease;
  touch-action:none;
}

.foodImg{
  width:140px;
  height:140px;
  margin:0 auto;
  border-radius:24px;
  background-image:url("images/foods-sprite.png");
  background-size:400% 300%;
  background-position:calc(var(--x) * 100%) calc(var(--y) * 100%);
  box-shadow:0 10px 25px rgba(15,23,42,.15);
}

.foodName{
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin-top:12px;
}

.prompt{
  text-align:center;
  font-size:14px;
  color:#475569;
  margin-top:6px;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:12px;
}

button{
  flex:1;
  padding:12px;
  border-radius:999px;
  border:none;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}

.btnHigh{background:rgba(220,38,38,.15); color:#fecaca; border:1px solid rgba(220,38,38,.3)}
.btnMod {background:rgba(245,158,11,.15); color:#fde68a; border:1px solid rgba(245,158,11,.3)}
.btnLow {background:rgba(22,163,74,.15); color:#bbf7d0; border:1px solid rgba(22,163,74,.3)}

.toast{
  margin-top:10px;
  background:rgba(2,6,23,.55);
  border:1px solid rgba(148,163,184,.2);
  padding:12px;
  border-radius:16px;
  font-size:13px;
}

.end{
  background:rgba(255,255,255,.08);
  border-radius:var(--radius);
  padding:18px;
  text-align:center;
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div>
      <h1>K Swipe</h1>
      <p>Swipe ← High · ↑ Moderate · → Low</p>
    </div>
    <div class="stats">
      Card <b id="n">1</b>/<b id="total">0</b><br>
      Score <b id="score">0</b>
    </div>
  </header>

  <div class="stack" id="stack"></div>

  <div class="controls" id="controls">
    <button class="btnHigh" onclick="answer('high')">⬅ High</button>
    <button class="btnMod" onclick="answer('mod')">⬆ Moderate</button>
    <button class="btnLow" onclick="answer('low')">Low ➡</button>
  </div>

  <div class="toast" id="toast" style="display:none;"></div>
</div>

<script>
const CARDS = [
  {name:"Banana",x:0,y:0,cat:"high",teach:"Bananas are usually high in potassium."},
  {name:"Avocado",x:1,y:0,cat:"high",teach:"Avocados are very high potassium."},
  {name:"Potato",x:2,y:0,cat:"high",teach:"Potatoes are high unless leached."},
  {name:"Tomato Sauce",x:3,y:0,cat:"high",teach:"Sauces concentrate potassium."},

  {name:"Broccoli",x:0,y:1,cat:"mod",teach:"Broccoli is moderate — portion matters."},
  {name:"Beans",x:1,y:1,cat:"mod",teach:"Beans can be moderate to high."},
  {name:"Milk/Yogurt",x:2,y:1,cat:"mod",teach:"Dairy is moderate potassium."},
  {name:"Cucumber",x:3,y:1,cat:"low",teach:"Cucumbers are low potassium."},

  {name:"Apple",x:0,y:2,cat:"low",teach:"Apples are low potassium."},
  {name:"Blueberries",x:1,y:2,cat:"low",teach:"Blueberries are kidney-friendly."},
  {name:"Grapes",x:2,y:2,cat:"low",teach:"Grapes are low potassium."},
  {name:"Cucumber (alt)",x:3,y:2,cat:"low",teach:"Mostly water — low potassium."}
];

let deck = CARDS.sort(()=>Math.random()-0.5);
let i=0, score=0, busy=false;

const stack=document.getElementById("stack");
const toast=document.getElementById("toast");
document.getElementById("total").textContent=deck.length;

function render(){
  stack.innerHTML="";
  toast.style.display="none";
  if(i>=deck.length){ return end(); }

  document.getElementById("n").textContent=i+1;
  document.getElementById("score").textContent=score;

  const c=deck[i];
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="foodImg" style="--x:${c.x};--y:${c.y}"></div>
    <div class="foodName">${c.name}</div>
    <div class="prompt">Is this high, moderate, or low potassium?</div>
  `;
  stack.appendChild(card);
}

function answer(choice){
  if(busy) return;
  busy=true;
  const c=deck[i];
  const ok=choice===c.cat;
  score+= ok ? 1 : -1;

  toast.style.display="block";
  toast.innerHTML=(ok?"✅ Correct. ":"❌ Not quite. ")+c.teach;

  setTimeout(()=>{
    i++; busy=false; render();
  },500);
}

function end(){
  document.getElementById("controls").style.display="none";
  stack.innerHTML=`
    <div class="end">
      <h2>Done ✅</h2>
      <p>Score: ${score}</p>
      <p>High potassium foods often include juices, sauces, dried foods, and potatoes.</p>
      <button onclick="location.reload()">Play again</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
