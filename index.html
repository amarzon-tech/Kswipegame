<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>K Swipe — Journey Mode</title>

<style>
  :root{
    --shadow:0 18px 55px rgba(0,0,0,.35);
    --radius:28px;

    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;

    --high:#dc2626;
    --mod:#f59e0b;
    --low:#16a34a;

    --bgA:#0b1220;
    --bgB:#14244b;
    --accent1:#60a5fa;
    --accent2:#a78bfa;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }

  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color:#e5e7eb;
    overflow:hidden;
    background: linear-gradient(135deg, var(--bgA), var(--bgB));
    transition: background 450ms ease;
  }

  /* Fullscreen shell (iPhone safe areas) */
  .shell{
    position:fixed;
    inset:0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    display:flex;
    justify-content:center;
    align-items:stretch;
  }

  .app{
    width: min(520px, 100%);
    height: 100dvh;
    display:flex;
    flex-direction:column;
    padding: 14px 14px 16px;
    gap: 10px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding-top: 6px;
  }

  .brand{
    display:flex; gap:10px; align-items:center;
  }

  .logo{
    width:42px; height:42px; border-radius:14px;
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    display:grid; place-items:center;
    font-weight:1000;
    box-shadow: 0 10px 30px rgba(96,165,250,.22);
  }

  .title h1{ margin:0; font-size:18px; }
  .title p{ margin:2px 0 0; font-size:12px; color:#cbd5f5; opacity:.85; }

  .hud{
    text-align:right;
    font-size:12px;
    color:#cbd5f5;
    line-height:1.35;
  }
  .hud b{ color:#fff; }

  .rankPill{
    margin-top:4px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    border-radius:999px;
    border:1px solid rgba(148,163,184,.18);
    background: rgba(2,6,23,.35);
    color:#e5e7eb;
    font-size:12px;
    white-space:nowrap;
  }

  .topBars{
    display:flex;
    gap:10px;
    align-items:center;
  }

  .progress{
    flex:1;
    height:10px;
    background: rgba(255,255,255,.12);
    border-radius:999px;
    overflow:hidden;
    border: 1px solid rgba(148,163,184,.16);
  }
  .progress > div{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, rgba(96,165,250,.95), rgba(167,139,250,.95));
    border-radius:999px;
    transition: width .25s ease;
  }

  .streakPill{
    font-size:12px;
    padding:7px 10px;
    border-radius:999px;
    border:1px solid rgba(148,163,184,.18);
    background: rgba(2,6,23,.35);
    color:#e5e7eb;
    white-space:nowrap;
  }

  .stack{
    position:relative;
    flex: 1;
    min-height: 320px;
  }

  .card{
    position:absolute;
    inset:0;
    background: var(--card);
    color: var(--text);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition: transform .25s ease, opacity .25s ease;
    touch-action:none;
    overflow:hidden;
  }

  .badgeRow{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .pill{
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    background:#eef2ff;
    color:#3730a3;
    font-weight:900;
  }
  .pill2{
    background:#f1f5f9;
    color:#0f172a;
  }

  .content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding: 4px 0;
  }

  /* Sprite tile */
  .foodImg{
    width: 150px;
    height: 150px;
    border-radius: 26px;
    background-image: url("images/foods-sprite.png");
    background-size: 400% 300%;
    background-position: calc(var(--x) * 100%) calc(var(--y) * 100%);
    box-shadow: 0 12px 26px rgba(15,23,42,.15);
    background-color:#f8fafc;
  }

  /* Emoji tile fallback */
  .emojiTile{
    width:150px; height:150px;
    border-radius:26px;
    background:#f8fafc;
    box-shadow: 0 12px 26px rgba(15,23,42,.15);
    display:grid; place-items:center;
    font-size:70px;
  }

  .name{
    font-size: 26px;
    font-weight: 1000;
    letter-spacing:-.02em;
    text-align:center;
    margin-top:2px;
  }
  .prompt{
    font-size:14px;
    color:#475569;
    text-align:center;
    max-width: 380px;
  }

  .mealList{
    width:100%;
    margin-top:6px;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-width: 460px;
  }
  .mealItem{
    background:#f1f5f9;
    color:#0f172a;
    border-radius: 14px;
    padding:10px 12px;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .mealItem small{ color:#64748b; }

  /* Swipe overlays */
  .overlay{
    position:absolute;
    top:14px;
    padding:10px 14px;
    border-radius:16px;
    font-weight:1000;
    letter-spacing:.02em;
    opacity:0;
    transform: scale(.98);
    transition: opacity .12s ease, transform .12s ease;
    pointer-events:none;
  }
  .overlay.left{
    left:14px;
    background: rgba(220,38,38,.12);
    border:1px solid rgba(220,38,38,.28);
    color:#fecaca;
  }
  .overlay.up{
    left:50%;
    transform: translateX(-50%) scale(.98);
    background: rgba(245,158,11,.12);
    border:1px solid rgba(245,158,11,.28);
    color:#fde68a;
  }
  .overlay.right{
    right:14px;
    background: rgba(22,163,74,.12);
    border:1px solid rgba(22,163,74,.28);
    color:#bbf7d0;
  }

  .controls{
    display:flex;
    gap:10px;
  }
  button{
    flex:1;
    border:0;
    border-radius:999px;
    padding: 14px 10px;
    font-weight:1000;
    font-size:14px;
    cursor:pointer;
    transition: transform .08s ease;
  }
  button:active{ transform: scale(.98); }

  .btnHigh{ background: rgba(220,38,38,.14); color:#fecaca; border:1px solid rgba(220,38,38,.28) }
  .btnMod { background: rgba(245,158,11,.14); color:#fde68a; border:1px solid rgba(245,158,11,.28) }
  .btnLow { background: rgba(22,163,74,.14); color:#bbf7d0; border:1px solid rgba(22,163,74,.28) }
  .btnHigh span,.btnMod span,.btnLow span{ color:#fff; }

  .toast{
    background: rgba(2,6,23,.55);
    border:1px solid rgba(148,163,184,.18);
    padding: 12px 14px;
    border-radius: 18px;
    font-size:13px;
    line-height:1.35;
    min-height: 54px;
  }
  .toast.good{ border-color: rgba(34,197,94,.35); }
  .toast.bad { border-color: rgba(239,68,68,.35); }
  .toast b{ color:#fff; }

  .footer{
    font-size:11px;
    color:#cbd5f5;
    opacity:.75;
    text-align:center;
    padding-bottom: 4px;
  }

  /* Level-up modal */
  .modal{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding: 16px;
    background: rgba(0,0,0,.55);
  }
  .panel{
    width: min(520px, 100%);
    border-radius: 24px;
    padding: 16px;
    text-align:center;
    color:#e5e7eb;
    box-shadow: var(--shadow);
    border: 1px solid rgba(148,163,184,.18);
    background:
      radial-gradient(700px 320px at 20% 10%, rgba(96,165,250,.35), transparent 55%),
      radial-gradient(700px 320px at 80% 0%, rgba(167,139,250,.35), transparent 55%),
      rgba(255,255,255,.10);
  }
  .panel h2{ margin:0 0 6px; font-size:20px; }
  .panel p{ margin:6px 0; color:#e2e8f0; font-size:13px; line-height:1.35; }
  .panel .big{
    font-size:40px;
    font-weight:1000;
    margin: 6px 0 6px;
  }
  .rankLine{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin: 8px 0 10px;
    font-size:14px;
    color:#e5e7eb;
    flex-wrap: wrap;
  }
  .rankTag{
    padding:6px 10px;
    border-radius:999px;
    border:1px solid rgba(148,163,184,.25);
    background: rgba(2,6,23,.35);
    font-weight:900;
  }
  .panel .btnRow{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .panel .btnRow button{
    background: linear-gradient(135deg, rgba(96,165,250,.92), rgba(167,139,250,.92));
    color:#0b1220;
    border:0;
  }
  .panel .btnRow .secondary{
    background: rgba(148,163,184,.20) !important;
    color:#e5e7eb !important;
    border:1px solid rgba(148,163,184,.22) !important;
  }

  /* celebration confetti */
  .confetti{
    position:fixed;
    left:0; top:0;
    width:100%; height:100%;
    pointer-events:none;
    overflow:hidden;
  }
  .conf{
    position:absolute;
    font-size:24px;
    opacity:.95;
    animation: fall 900ms ease-out forwards;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.22));
  }
  @keyframes fall{
    from { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    to { transform: translateY(260px) rotate(220deg); opacity: 0; }
  }
</style>
</head>

<body>
<div class="shell">
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">K+</div>
        <div class="title">
          <h1>K Swipe: Journey Mode</h1>
          <p>10 swipes per level • Need <b>7/10</b> to rank up</p>
        </div>
      </div>
      <div class="hud">
        Level <b id="level">1</b>/5<br/>
        Card <b id="cardN">1</b>/10<br/>
        Correct <b id="correctN">0</b>/10
        <div class="rankPill" id="rankPill">🧑‍🎓 <b>Rookie</b></div>
      </div>
    </header>

    <div class="topBars">
      <div class="progress"><div id="prog"></div></div>
      <div class="streakPill">Streak: <b id="streak">0</b> 🔥</div>
    </div>

    <div class="stack" id="stack"></div>

    <div class="controls" id="controls">
      <button class="btnHigh" id="highBtn">⬅ <span>High</span><br/>Limit</button>
      <button class="btnMod" id="modBtn">⬆ <span>Moderate</span><br/>Portion</button>
      <button class="btnLow" id="lowBtn"><span>Low</span> ➡<br/>Safer</button>
    </div>

    <div class="toast" id="toast" style="display:none;"></div>

    <div class="footer">
      Learning tool only. Potassium goals depend on labs, CKD stage, dialysis, meds.
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="panel" id="panel"></div>
</div>

<div class="confetti" id="confetti"></div>

<script>
/* ---------- SPRITE DETECTION ---------- */
/* Option A: Emoji-only mode. Sprites disabled to avoid mismatched/incorrect food images. */
let spriteAvailable = false;

  spriteAvailable = false;

}

/* ---------- LEVEL THEMES (background + rank journey) ---------- */
const LEVELS = [

    vibe:"You’re learning the rules of the potassium universe. Respect." },

function applyLevelTheme(level){
  const t = LEVELS[level-1];
  document.documentElement.style.setProperty("--bgA", t.bgA);
  document.documentElement.style.setProperty("--bgB", t.bgB);
  document.documentElement.style.setProperty("--accent1", t.a1);
  document.documentElement.style.setProperty("--accent2", t.a2);

  const rp = document.getElementById("rankPill");
  rp.innerHTML = `${t.emoji} <b>${t.name}</b>`;
}

/* ---------- SPRITES (coords in 4x3 grid) ---------- */
const SPRITES = {

    teach:"Wings are moderate; fries often push the whole plate high."
  },
  {
    name:"Chili Bowl + Bread", emoji:"🥣", cat:"high",
    parts:[
      {t:"Chili 🥣", k:"high"},
      {t:"Beans 🫘", k:"high"},
      {t:"Tomato base 🍅", k:"high"},
      {t:"Bread 🍞", k:"low"},
      {t:"Water 💧", k:"low"},
    ],
    teach:"Chili often runs high potassium (beans + tomato)."
  },
  {
    name:"Chicken Soup + Bread", emoji:"🍲", cat:"mod",
    parts:[
      {t:"Chicken noodle soup 🍲", k:"mod"},
      {t:"Bread 🍞", k:"low"},
      {t:"Side salad 🥗", k:"low"},
      {t:"Fruit (apple) 🍎", k:"low"},
      {t:"Water 💧", k:"low"},
    ],
    teach:"Often moderate; the soup’s ingredients and portions matter."
  },
  {
    name:"Breakfast-for-Dinner", emoji:"🥞", cat:"low",
    parts:[
      {t:"Pancakes 🥞", k:"low"},
      {t:"Eggs 🍳", k:"low"},
      {t:"Apple 🍎", k:"low"},
      {t:"Small yogurt 🥛", k:"mod"},
      {t:"Water 💧", k:"low"},
    ],
    teach:"Mostly low potassium—still keep portions reasonable."
  }
];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function makeDinnerPlate(){
  return JSON.parse(JSON.stringify(pick(MEAL_LIBRARY)));
}

/* ---------- LEVEL SYSTEM ---------- */
const MAX_LEVEL = 5;
const PASS_SCORE = 7; // 7/10 to advance
let level = 1;

let round = [];
let idx = 0;
let correct = 0;
let streak = 0;
let busy = false;

/* ---------- UI ---------- */
const stackEl = document.getElementById("stack");
const toastEl = document.getElementById("toast");
const levelEl = document.getElementById("level");
const cardNEl = document.getElementById("cardN");
const correctEl = document.getElementById("correctN");
const streakEl = document.getElementById("streak");
const progEl = document.getElementById("prog");

const modal = document.getElementById("modal");
const panel = document.getElementById("panel");
const confetti = document.getElementById("confetti");

document.getElementById("highBtn").addEventListener("click", ()=>answer("high"));
document.getElementById("modBtn").addEventListener("click",  ()=>answer("mod"));
document.getElementById("lowBtn").addEventListener("click",  ()=>answer("low"));

function shuffle(a){
  const arr = [...a];
  for (let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildRound(){
  const foods = shuffle(FOODS).slice(0,7).map(f => ({type:"food", ...f}));
  const plates = Array.from({length:3}, ()=>({type:"meal", ...makeDinnerPlate()}));
  return shuffle([...foods, ...plates]);
}

function hudUpdate(){
  levelEl.textContent = level;
  cardNEl.textContent = (idx+1);
  correctEl.textContent = correct;
  streakEl.textContent = streak;
  progEl.style.width = Math.round((idx/10)*100) + "%";
}

function funCorrectLine(){
  const lines = [
    "Kidney-approved vibes. ✅😎",
    "That’s a clean read. Like… suspiciously clean. 🧼",
    "Potassium tried to sneak in. You said: “absolutely not.” 🚫",
    "Clinical accuracy with main-character energy. 🎬",
    "Textbook move. Your nephrologist would clap. 👏",
    "You just gained +10 resistance to hidden potassium. 🛡️",
  ];
  if (streak >= 3) lines.push("Combo streak! You’re cooking (not literally). 🔥");
  if (streak >= 6) lines.push("This streak is disrespectful to potatoes. 🥔💀");
  return lines[Math.floor(Math.random()*lines.length)];
}

function funWrongLine(){
  const lines = [
    "Sneaky one. Potassium was wearing camouflage. 🥷",
    "Not quite. That food just gaslit you. 😅",
    "Your kidneys: “We’ll allow it… once.” 🤨",
    "That answer was brave. Not correct. But brave. 🫡",
    "It’s fine. Everyone gets jump-scared by marinara. 🍅",
    "Plot twist: the side dish was the villain. 🦹‍♂️",
  ];
  return lines[Math.floor(Math.random()*lines.length)];
}

function showToast(ok, teach){
  toastEl.style.display = "block";
  toastEl.className = "toast " + (ok ? "good" : "bad");
  toastEl.innerHTML =
    (ok ? "<b>✅ Correct.</b> " : "<b>❌ Not quite.</b> ")
    + teach + " <span style='color:#cbd5e1'>(" + (ok?funCorrectLine():funWrongLine()) + ")</span>";
}

function makeConfettiBurst(){
  const emojis = ["✨","🎉","⭐️","💥","👏","🫶","🏆","🔥"];
  for (let i=0;i<16;i++){
    const d = document.createElement("div");
    d.className = "conf";
    d.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    d.style.left = (8 + Math.random()*84) + "%";
    d.style.top = (8 + Math.random()*18) + "%";
    d.style.animationDelay = (Math.random()*140) + "ms";
    confetti.appendChild(d);
    setTimeout(()=>d.remove(), 1000);
  }
}

function renderCard(){
  stackEl.innerHTML = "";
  toastEl.style.display = "none";

  const c = round[idx];
  hudUpdate();

  const card = document.createElement("div");
  card.className = "card";

  const overlays = `
    <div class="overlay left" id="ovLeft">HIGH</div>
    <div class="overlay up" id="ovUp">MODERATE</div>
    <div class="overlay right" id="ovRight">LOW</div>
  `;

  const top = `
    <div class="badgeRow">
      <div class="pill">Level ${level} • Card ${idx+1}/10</div>
      <div class="pill pill2">${c.type === "meal" ? "Comfort Plate" : "Food"}</div>
    </div>
  `;

  let media = "";
// Emoji-only mode (Option A): always render emojis so patients never see the wrong food image.
const emoji = (c.type==="meal") ? (c.emoji || "🍽️") : (c.emoji || "🍴");
media = `<div class="emojiTile">${emoji}</div>`;
const name = (c.type==="meal")
    ? c.name
    : (c.name || (SPRITES[c.key]?.label ?? "Food"));

  const prompt = (c.type==="meal")
    ? "Overall, is this comfort plate high, moderate, or low potassium?"
    : "Is this item high, moderate, or low potassium?";

  let mid = `
    <div class="content">
      ${media}
      <div class="name">${name}</div>
      <div class="prompt">${prompt}</div>
    </div>
  `;

  if (c.type==="meal"){
    const list = c.parts.map(p => `<div class="mealItem"><span>${p.t}</span><small>${p.k}</small></div>`).join("");
    mid += `<div class="mealList">${list}</div>`;
  }

  const hint = `
    <div style="font-size:12px;color:#64748b;text-align:center;">
      Boss-fight ingredients: potatoes 🥔, marinara 🍅, beans 🫘, dried fruit 🍑, coconut water 🥥.
    </div>
  `;

  card.innerHTML = overlays + top + mid + hint;
  stackEl.appendChild(card);

  enableSwipe(card);
}

function answer(choice){
  if (busy) return;
  busy = true;

  const c = round[idx];
  const ok = (choice === c.cat);

  if (ok){ correct += 1; streak += 1; }
  else { streak = 0; }

  showToast(ok, c.teach);

  const card = stackEl.querySelector(".card");
  if (card){
    if (choice === "high") card.style.transform = "translateX(-160%) rotate(-12deg)";
    if (choice === "low")  card.style.transform = "translateX(160%) rotate(12deg)";
    if (choice === "mod")  card.style.transform = "translateY(-160%) rotate(0deg)";
    card.style.opacity = "0";
  }

  if (ok && (streak === 3 || streak === 5 || streak === 7)){
    makeConfettiBurst();
  }

  setTimeout(()=>{
    idx += 1;
    busy = false;

    if (idx >= 10){
      endOfLevel();
    } else {
      renderCard();
    }
  }, 520);
}

function endOfLevel(){
  const passed = (correct >= PASS_SCORE);
  const currentRank = LEVELS[level-1];
  const nextRank = LEVELS[Math.min(level, MAX_LEVEL-1)];

  const passLines = [
    "Rank up unlocked. Potassium is now your side quest. 🗺️",
    "You passed. Congratulations — you’re officially hard to trick. 😎",
    `That’s ${correct}/10. Your label-reading aura is growing. ✨`,
    "You cleared the level. Marinara is trembling. 🍅😰",
  ];
  const failLines = [
    "Not enough to rank up… yet. Run it back and bully these foods. 😈",
    "Close! Repeat the level and reclaim the throne. 👑",
    "The fries got lucky. Try again. 🍟🙃",
    "You’re learning — do another round and you’ll pass easy. 🔁",
  ];

  const headline = passed ? "RANK UP ✅" : "LEVEL RETRY 🧠";
  const big = `${correct}/10`;
  const rule = `Rule: get <b>${PASS_SCORE}/10</b> to advance.`;
  const line = passed
    ? passLines[Math.floor(Math.random()*passLines.length)]
    : failLines[Math.floor(Math.random()*failLines.length)];

  const rankLine = passed
    ? `<div class="rankLine"><span class="rankTag">${currentRank.emoji} ${currentRank.name}</span> → <span class="rankTag">${nextRank.emoji} ${nextRank.name}</span></div>`
    : `<div class="rankLine"><span class="rankTag">${currentRank.emoji} ${currentRank.name}</span> <span style="opacity:.8;">(hold the line)</span></div>`;

  panel.innerHTML = `
    <h2>${headline}</h2>
    <div class="big">${big}</div>
    ${rankLine}
    <p>${line}</p>
    <p style="opacity:.95;">${rule}</p>
    <p style="color:#cbd5f5;opacity:.95;">${LEVELS[level-1].vibe}</p>
    <div class="btnRow">
      <button id="nextBtn">${passed ? (level < MAX_LEVEL ? "Continue Journey" : "Finish Journey") : "Try Again"}</button>
      <button class="secondary" id="resetBtn">Reset Game</button>
    </div>
  `;

  modal.style.display = "flex";
  if (passed) makeConfettiBurst();

  document.getElementById("nextBtn").onclick = () => {
    modal.style.display = "none";
    if (passed){
      if (level < MAX_LEVEL){
        level += 1;
        applyLevelTheme(level);
        startLevel();
      } else {
        showWinScreen();
      }
    } else {
      startLevel(); // repeat same level
    }
  };

  document.getElementById("resetBtn").onclick = () => {
    modal.style.display = "none";
    level = 1;
    applyLevelTheme(level);
    startLevel();
  };
}

function showWinScreen(){
  const guru = LEVELS[MAX_LEVEL-1];
  panel.innerHTML = `
    <h2>JOURNEY COMPLETE 🏆</h2>
    <div class="big">${guru.emoji}</div>
    <p><b>${guru.name} status achieved.</b> Potassium now asks <i>you</i> for permission.</p>
    <p style="color:#cbd5f5;opacity:.95;">
      High potassium often hides in potatoes, marinara/tomato sauce, beans, dried fruit,
      coconut water/juice, and big portions of cooked greens. “Moderate” is portion + preparation territory.
    </p>
    <div class="btnRow">
      <button id="playAgainBtn">Play Again</button>
      <button class="secondary" id="closeBtn">Close</button>
    </div>
  `;
  modal.style.display = "flex";
  makeConfettiBurst();

  document.getElementById("playAgainBtn").onclick = () => {
    modal.style.display = "none";
    level = 1;
    applyLevelTheme(level);
    startLevel();
  };
  document.getElementById("closeBtn").onclick = () => {
    modal.style.display = "none";
  };
}

function startLevel(){
  round = buildRound(); // 7 foods + 3 comfort plates
  idx = 0;
  correct = 0;
  streak = 0;
  progEl.style.width = "0%";
  toastEl.style.display = "none";
  hudUpdate();
  renderCard();
}

function enableSwipe(card){
  let startX=0, startY=0, dx=0, dy=0, dragging=false;

  const ovLeft  = card.querySelector("#ovLeft");
  const ovUp    = card.querySelector("#ovUp");
  const ovRight = card.querySelector("#ovRight");

  const onDown = (e) => {
    if (busy) return;
    dragging = true;
    card.style.transition = "none";
    startX = e.clientX; startY = e.clientY;
    dx = 0; dy = 0;
  };

  const onMove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    dy = e.clientY - startY;

    const rot = Math.max(-15, Math.min(15, dx / 18));
    card.style.transform = `translateX(${dx}px) translateY(${dy}px) rotate(${rot}deg)`;

    const ax = Math.abs(dx), ay = Math.abs(dy);
    ovLeft.style.opacity = 0; ovUp.style.opacity = 0; ovRight.style.opacity = 0;

    if (ax > ay){
      const a = Math.min(1, ax / 120);
      if (dx < 0){ ovLeft.style.opacity = a; ovLeft.style.transform = `scale(${0.98 + a*0.04})`; }
      else { ovRight.style.opacity = a; ovRight.style.transform = `scale(${0.98 + a*0.04})`; }
    } else {
      if (dy < 0){
        const a = Math.min(1, ay / 120);
        ovUp.style.opacity = a;
        ovUp.style.transform = `translateX(-50%) scale(${0.98 + a*0.04})`;
      }
    }
  };

  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = "transform .25s ease, opacity .25s ease";

    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > ay && dx <= -110) answer("high");
    else if (ax > ay && dx >= 110) answer("low");
    else if (ay >= ax && dy <= -110) answer("mod");
    else {
      card.style.transform = "translateX(0) translateY(0) rotate(0deg)";
      ovLeft.style.opacity = 0; ovUp.style.opacity = 0; ovRight.style.opacity = 0;
    }
  };

  card.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

/* Prevent iOS gesture zoom weirdness */
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ---------- BOOT ---------- */
(async function boot(){
  await checkSprite();     // spriteAvailable true/false
  applyLevelTheme(level);  // Level 1 theme
  startLevel();
})();
</script>
