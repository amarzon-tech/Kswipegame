<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>K Swipe</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#101b35;
      --card:#ffffff;
      --muted:#94a3b8;
      --text:#0f172a;
      --good:#16a34a;
      --bad:#dc2626;
      --shadow: 0 18px 55px rgba(0,0,0,.35);
      --radius:28px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: radial-gradient(1200px 800px at 10% 20%, #1a2b5a 0%, transparent 50%),
                  radial-gradient(1000px 700px at 90% 30%, #233c7a 0%, transparent 55%),
                  linear-gradient(135deg,var(--bg1),var(--bg2));
      color:#e5e7eb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding:16px;
    }
    .app{
      width:min(440px,100%);
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
    }
    .logo{
      width:38px; height:38px; border-radius:14px;
      background: linear-gradient(135deg,#60a5fa,#a78bfa);
      display:grid; place-items:center;
      box-shadow: 0 10px 30px rgba(96,165,250,.25);
      font-weight:800;
    }
    .title{
      line-height:1.1;
    }
    .title h1{margin:0; font-size:18px}
    .title p{margin:2px 0 0; color:var(--muted); font-size:12px}
    .stats{
      text-align:right;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }
    .stats b{color:#fff}
    .stack{
      position:relative;
      height:360px;
      margin:10px 0 12px;
    }
    .card{
      position:absolute; inset:0;
      background: var(--card);
      color: var(--text);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding:22px 20px 18px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      touch-action: none; /* important for swipe */
      user-select:none;
      transform: translateX(0) rotate(0deg);
      transition: transform .25s ease, opacity .25s ease;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute; inset:-60px -60px auto auto;
      width:180px; height:180px; border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(96,165,250,.45), transparent 55%);
      filter: blur(1px);
      pointer-events:none;
    }
    .cardTop{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    }
    .pill{
      font-size:11px;
      padding:6px 10px;
      border-radius:999px;
      background:#eef2ff;
      color:#3730a3;
      font-weight:600;
    }
    .foodEmoji{
      font-size:64px; line-height:1;
      margin-top:10px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.12));
    }
    .foodName{
      margin:10px 0 0;
      font-size:28px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .prompt{
      margin:8px 0 0;
      color:#475569;
      font-size:14px;
    }
    .hintRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:10px;
      color:#64748b;
      font-size:12px;
    }
    .hintRow span{
      display:flex; gap:6px; align-items:center;
      background:#f1f5f9;
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }
    .controls{
      display:flex;
      gap:12px;
      margin:10px 0 10px;
    }
    button{
      flex:1;
      border:0;
      border-radius:999px;
      padding:14px 12px;
      font-weight:800;
      font-size:15px;
      cursor:pointer;
      transition: transform .08s ease;
    }
    button:active{transform: scale(.98)}
    .btnHigh{background: rgba(220,38,38,.14); color: #fecaca; border:1px solid rgba(220,38,38,.25)}
    .btnLow{background: rgba(22,163,74,.14); color: #bbf7d0; border:1px solid rgba(22,163,74,.25)}
    .btnHigh span, .btnLow span{color:#fff}
    .helper{
      color:var(--muted);
      font-size:12px;
      text-align:center;
      margin-top:2px;
    }

    .toast{
      margin-top:10px;
      background: rgba(2,6,23,.55);
      border:1px solid rgba(148,163,184,.18);
      padding:12px 14px;
      border-radius:18px;
      min-height:54px;
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .toastIcon{
      width:30px; height:30px; border-radius:10px;
      display:grid; place-items:center;
      flex:0 0 auto;
      font-weight:900;
    }
    .toast.good .toastIcon{background: rgba(22,163,74,.25); color:#bbf7d0}
    .toast.bad .toastIcon{background: rgba(220,38,38,.25); color:#fecaca}
    .toast .msg{
      font-size:13px;
      color:#e5e7eb;
      line-height:1.35;
    }
    .toast .msg b{color:#fff}
    .footerNote{
      margin-top:10px;
      color:#93a3b8;
      font-size:11px;
      text-align:center;
    }

    /* swipe overlays */
    .overlay{
      position:absolute;
      top:18px;
      padding:10px 14px;
      border-radius:16px;
      font-weight:900;
      letter-spacing:.02em;
      opacity:0;
      transform: scale(.98);
      transition: opacity .12s ease, transform .12s ease;
      pointer-events:none;
    }
    .overlay.left{
      left:18px;
      background: rgba(220,38,38,.12);
      border:1px solid rgba(220,38,38,.25);
      color:#fecaca;
    }
    .overlay.right{
      right:18px;
      background: rgba(22,163,74,.12);
      border:1px solid rgba(22,163,74,.25);
      color:#bbf7d0;
    }

    .end{
      background: rgba(255,255,255,.08);
      border:1px solid rgba(148,163,184,.16);
      border-radius: var(--radius);
      padding:18px;
      text-align:center;
      box-shadow: var(--shadow);
    }
    .end h2{margin:0 0 6px; font-size:20px}
    .end p{margin:6px 0; color:var(--muted); font-size:13px; line-height:1.35}
    .restart{
      margin-top:10px;
      background:#60a5fa;
      color:#0b1220;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">K</div>
        <div class="title">
          <h1>K Swipe</h1>
          <p>Swipe left = High K • Swipe right = Low K</p>
        </div>
      </div>
      <div class="stats">
        Card <b id="n">1</b>/<b id="total">0</b><br/>
        Score <b id="score">0</b> • Streak <b id="streak">0</b>
      </div>
    </header>

    <div class="stack" id="stack"></div>

    <div class="controls" id="controls">
      <button class="btnHigh" id="highBtn">⬅ <span>High K</span> (limit)</button>
      <button class="btnLow" id="lowBtn"><span>Low K</span> (safer) ➡</button>
    </div>

    <div class="helper">Tip: Patients can tap buttons if swiping is hard.</div>

    <div class="toast" id="toast" style="display:none;">
      <div class="toastIcon" id="toastIcon">✓</div>
      <div class="msg" id="toastMsg"></div>
    </div>

    <div class="footerNote">
      Learning tool only. Kidney diets are individualized (CKD stage, dialysis, meds, labs).
    </div>
  </div>

<script>
  // Patient-friendly deck.
  // category = "high" => swipe LEFT / High K button
  // category = "low"  => swipe RIGHT / Low K button
  const CARDS = [
    { name:"Banana", emoji:"🍌", category:"high",
      teach:"Bananas are usually <b>high in potassium</b>. Many kidney plans say “limit”." },
    { name:"Avocado", emoji:"🥑", category:"high",
      teach:"Avocado is <b>very high in potassium</b>, even in smaller servings." },
    { name:"Orange juice", emoji:"🧃", category:"high",
      teach:"Orange juice can be <b>high potassium</b> and raises levels quickly." },
    { name:"Potato (baked)", emoji:"🥔", category:"high",
      teach:"Potatoes are naturally <b>high potassium</b>. (Boiling & draining can lower it.)" },
    { name:"Tomato sauce", emoji:"🍅", category:"high",
      teach:"Sauces are concentrated—tomato sauce is often <b>higher potassium</b> than fresh." },
    { name:"Dried fruit", emoji:"🍑", category:"high",
      teach:"Dried fruits pack potassium into a small serving—often <b>high K</b>." },
    { name:"Beans / lentils", emoji:"🫘", category:"high",
      teach:"Beans can be healthy but commonly <b>high potassium</b> (portion matters)." },
    { name:"Coconut water", emoji:"🥥", category:"high",
      teach:"Coconut water is often a <b>potassium bomb</b>. Not great for many CKD patients." },

    { name:"Apple", emoji:"🍎", category:"low",
      teach:"Apples are generally <b>lower potassium</b> and often a safer fruit choice." },
    { name:"Blueberries", emoji:"🫐", category:"low",
      teach:"Blueberries are usually <b>low potassium</b>. Kidney-friendly snack." },
    { name:"Grapes", emoji:"🍇", category:"low",
      teach:"Grapes are generally <b>low potassium</b> in usual serving sizes." },
    { name:"Pineapple", emoji:"🍍", category:"low",
      teach:"Pineapple tends to be <b>lower potassium</b> than many fruits." },
    { name:"White rice", emoji:"🍚", category:"low",
      teach:"Plain white rice is usually <b>low potassium</b>." },
    { name:"Pasta (no tomato sauce)", emoji:"🍝", category:"low",
      teach:"Plain pasta is generally <b>low potassium</b> (watch the sauce!)." },
    { name:"Bread", emoji:"🍞", category:"low",
      teach:"Most breads are <b>low potassium</b> per slice." },
    { name:"Cucumber", emoji:"🥒", category:"low",
      teach:"Cucumber is mostly water—typically <b>low potassium</b>." },
  ];

  // ---- helpers
  function shuffle(arr){
    const a = [...arr];
    for (let i=a.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  // ---- state
  let deck = shuffle(CARDS);
  let i = 0;
  let score = 0;
  let streak = 0;
  let busy = false;

  // ---- elements
  const stack = document.getElementById("stack");
  const nEl = document.getElementById("n");
  const totalEl = document.getElementById("total");
  const scoreEl = document.getElementById("score");
  const streakEl = document.getElementById("streak");
  const toast = document.getElementById("toast");
  const toastIcon = document.getElementById("toastIcon");
  const toastMsg = document.getElementById("toastMsg");
  const controls = document.getElementById("controls");

  const highBtn = document.getElementById("highBtn");
  const lowBtn = document.getElementById("lowBtn");

  totalEl.textContent = deck.length;

  function render(){
    stack.innerHTML = "";
    toast.style.display = "none";

    if (i >= deck.length){
      showEnd();
      return;
    }

    nEl.textContent = (i+1);
    scoreEl.textContent = score;
    streakEl.textContent = streak;

    const c = deck[i];

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="overlay left" id="ovLeft">HIGH K</div>
      <div class="overlay right" id="ovRight">LOW K</div>

      <div>
        <div class="cardTop">
          <div class="pill">Potassium Trainer</div>
          <div class="pill" style="background:#f1f5f9;color:#0f172a;">Swipe or tap</div>
        </div>

        <div class="foodEmoji">${c.emoji}</div>
        <div class="foodName">${c.name}</div>
        <div class="prompt">Is this usually <b>high potassium</b> or <b>low potassium</b>?</div>

        <div class="hintRow">
          <span>⬅ High K (limit)</span>
          <span>Low K (safer) ➡</span>
        </div>
      </div>

      <div style="color:#64748b;font-size:12px;">
        Your goal: learn patterns. (Sauces, dried foods, big portions often ↑ potassium.)
      </div>
    `;
    stack.appendChild(card);

    enableSwipe(card);
  }

  function showToast(ok, teachHtml){
    toast.style.display = "flex";
    toast.className = "toast " + (ok ? "good" : "bad");
    toastIcon.textContent = ok ? "✓" : "!";
    toastMsg.innerHTML = (ok ? "<b>Correct.</b> " : "<b>Not quite.</b> ") + teachHtml;

    // a little humor, not too much for patients
    if (!ok){
      const extras = [
        "Your kidneys didn’t love that one… but they forgive you.",
        "No worries — that’s why we’re practicing.",
        "Potassium is sneaky. You’re not alone."
      ];
      toastMsg.innerHTML += " <span style='color:#cbd5e1'>(" + extras[Math.floor(Math.random()*extras.length)] + ")</span>";
    }
  }

  function answer(choice){ // choice: "high" or "low"
    if (busy || i >= deck.length) return;
    busy = true;

    const card = stack.querySelector(".card");
    const c = deck[i];
    const ok = (choice === c.category);

    if (ok){ score += 1; streak += 1; }
    else { score -= 1; streak = 0; }

    // animate out
    if (choice === "high") card.style.transform = "translateX(-160%) rotate(-12deg)";
    else card.style.transform = "translateX(160%) rotate(12deg)";
    card.style.opacity = "0";

    showToast(ok, c.teach);

    // next
    setTimeout(() => {
      i += 1;
      busy = false;
      render();
    }, 420);
  }

  highBtn.addEventListener("click", () => answer("high"));
  lowBtn.addEventListener("click", () => answer("low"));

  function enableSwipe(card){
    let startX = 0, startY = 0;
    let dx = 0, dy = 0;
    let dragging = false;

    const ovLeft = card.querySelector("#ovLeft");
    const ovRight = card.querySelector("#ovRight");

    const onDown = (e) => {
      if (busy) return;
      dragging = true;
      card.style.transition = "none";
      const p = getPoint(e);
      startX = p.x; startY = p.y;
      dx = 0; dy = 0;
    };

    const onMove = (e) => {
      if (!dragging) return;
      const p = getPoint(e);
      dx = p.x - startX;
      dy = p.y - startY;

      // move card with finger
      const rot = Math.max(-15, Math.min(15, dx / 18));
      card.style.transform = `translateX(${dx}px) translateY(${dy*0.15}px) rotate(${rot}deg)`;

      // overlays
      const a = Math.min(1, Math.abs(dx) / 120);
      if (dx < 0){
        ovLeft.style.opacity = a;
        ovLeft.style.transform = `scale(${0.98 + a*0.04})`;
        ovRight.style.opacity = 0;
      } else {
        ovRight.style.opacity = a;
        ovRight.style.transform = `scale(${0.98 + a*0.04})`;
        ovLeft.style.opacity = 0;
      }
    };

    const onUp = () => {
      if (!dragging) return;
      dragging = false;
      card.style.transition = "transform .25s ease, opacity .25s ease";

      // threshold
      if (dx <= -110) answer("high");
      else if (dx >= 110) answer("low");
      else {
        // snap back
        card.style.transform = "translateX(0) rotate(0deg)";
        ovLeft.style.opacity = 0;
        ovRight.style.opacity = 0;
      }
    };

    card.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp, { once:false });

    function getPoint(e){
      return { x: e.clientX, y: e.clientY };
    }
  }

  function showEnd(){
    controls.style.display = "none";
    stack.innerHTML = `
      <div class="end">
        <h2>Done ✅</h2>
        <p><b>Score:</b> ${score} • <b>Best streak:</b> (resets on mistakes)</p>
        <p>
          Takeaway: fruits/juices like banana & OJ, sauces, dried foods, and potatoes often run higher in potassium.
          Many “safer” picks include apples, berries, grapes, rice, pasta, cucumber.
        </p>
        <p style="margin-top:10px;">
          <button class="restart" id="restartBtn">Play again</button>
        </p>
      </div>
    `;
    document.getElementById("restartBtn").addEventListener("click", () => {
      deck = shuffle(CARDS);
      i = 0; score = 0; streak = 0; busy = false;
      controls.style.display = "flex";
      render();
    });
  }

  // Register service worker (PWA/offline)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", async () => {
      try { await navigator.serviceWorker.register("./sw.js"); } catch(e) {}
    });
  }

  render();
</script>
</body>
</html>
